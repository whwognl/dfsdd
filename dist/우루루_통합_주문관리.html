<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우루루 통합 주문관리</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230071e3'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif'%3E%EC%9A%B0%3C/text%3E%3C/svg%3E">
<style>
  /* ============================================================
     디자인 토큰 — 단일 소스 (Apple-like: 과한 볼드/네온 금지)
     ============================================================ */
  :root{
    --bg:#f5f5f7; --bg-elev:#fbfbfd; --card:#ffffff;
    --ink:#1d1d1f; --ink-2:#3a3a3c; --muted:#6e6e73; --muted-2:#86868b;
    --line:#d2d2d7; --line-soft:#e0e0e5;
    --fill:#f2f2f7; --fill-2:#f8f8fa;
    --brand:#0071e3; --brand-d:#005bb5; --brand-bg:#f0f7ff; --brand-line:#d6e7ff;
    --ok:#248a3d; --ok-bg:#e8f7ed; --ok-line:#cce8d1; --ok-row:#f4fbf6;
    --warn:#8a5a00; --warn-accent:#ff9f0a; --warn-bg:#fff8e8; --warn-line:#f1d08a; --warn-row:#fff8ed;
    --bad:#d70015; --bad-bg:#fff2f4; --bad-line:#f4b8c0; --bad-row:#fff1f3;
    --row-hover:#f8fbff;
    --r-sm:6px; --r-md:10px; --r-pill:999px;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
    --shadow-pop:0 12px 40px rgba(0,0,0,.18);
    --ring:0 0 0 3px rgba(0,113,227,.14);
    --fs-caption:11px; --fs-footnote:12px; --fs-body:13px; --fs-sub:15px;
    --fs-title3:17px; --fs-title2:22px; --fs-title1:28px;
    --w-reg:400; --w-med:510; --w-semi:590; --w-bold:650;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); font-size:var(--fs-body); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit; border-color:var(--line); color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brand); box-shadow:var(--ring)}
  a{color:var(--brand)}
  .hidden{display:none !important}

  /* ---- 상단바 ---- */
  header.topbar{
    position:sticky; top:0; z-index:30;
    background:rgba(251,251,253,.86);
    backdrop-filter:saturate(180%) blur(18px); -webkit-backdrop-filter:saturate(180%) blur(18px);
    border-bottom:1px solid rgba(0,0,0,.08);
    display:flex; align-items:center; gap:10px; padding:9px 16px;
  }
  .logo{font-weight:var(--w-semi); font-size:var(--fs-sub); white-space:nowrap}
  .logo small{display:block; font-weight:var(--w-reg); font-size:var(--fs-caption); color:var(--muted-2)}
  .topbar .spacer{flex:1}
  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-footnote); font-weight:var(--w-med);
    color:var(--ok); background:var(--ok-bg); border:1px solid var(--ok-line); padding:4px 10px; border-radius:var(--r-pill);
    white-space:nowrap;
  }
  .pill.danger{color:var(--bad); background:var(--bad-bg); border-color:var(--bad-line)}

  /* ---- 버튼 ---- */
  .btn{
    min-height:32px; border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:6px 12px; border-radius:var(--r-sm); font-size:var(--fs-body); font-weight:var(--w-semi);
    transition:background .12s,border-color .12s,transform .08s; white-space:nowrap;
  }
  .btn:hover{background:var(--bg); border-color:#c7c7cc}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
  .btn.primary:hover{background:var(--brand-d); border-color:var(--brand-d)}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
  .btn.ghost:hover{background:var(--fill); color:var(--ink)}
  .btn.sm{min-height:28px; padding:4px 9px; font-size:var(--fs-footnote)}
  .btn.danger{border-color:var(--bad-line); color:var(--bad); background:var(--bad-bg)}
  .btn.danger:hover{background:#ffe4e9}
  .btn:disabled{opacity:.42; cursor:not-allowed}
  .mini{border:1px solid var(--line); background:#fff; color:var(--ink-2); border-radius:var(--r-sm);
    padding:2px 7px; font-size:var(--fs-caption); font-weight:var(--w-semi); line-height:1.4; white-space:nowrap}
  .mini:hover{background:var(--bg)}
  .mini.blue{background:var(--brand-bg); border-color:var(--brand-line); color:var(--brand)}
  .mini.green{background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok)}
  .mini.red{background:var(--bad-bg); border-color:var(--bad-line); color:var(--bad)}
  .mini:disabled{opacity:.4; cursor:not-allowed}

  main{width:100%; padding:14px 12px 72px}

  /* ---- 탭 ---- */
  .tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:14px; overflow-x:auto}
  .tabs .tab{border:0; background:transparent; padding:9px 13px; font-size:var(--fs-body);
    font-weight:var(--w-semi); color:var(--muted); border-bottom:2px solid transparent; white-space:nowrap}
  .tabs .tab:hover{color:var(--ink)}
  .tabs .tab.on{color:var(--brand); border-bottom-color:var(--brand)}
  .tabs .tab b{margin-left:6px; font-weight:var(--w-med); font-size:var(--fs-caption);
    background:var(--fill); color:var(--muted); border-radius:var(--r-pill); padding:1px 6px}
  .tabs .tab.alert b{background:var(--bad-bg); color:var(--bad)}

  /* ---- 카드/패널 ---- */
  .panel{background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r-md);
    box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px}
  .panel h2{margin:0 0 2px; font-size:var(--fs-title3); font-weight:var(--w-semi)}
  .panel .sub{color:var(--muted); margin:0 0 14px; font-size:var(--fs-footnote)}
  .panel-head{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
  .panel-head h2{margin:0; font-size:var(--fs-title3); font-weight:var(--w-semi)}
  .panel-head .spacer{flex:1}
  .section-title{font-size:var(--fs-footnote); font-weight:var(--w-semi); color:var(--muted);
    margin:0 0 8px; letter-spacing:.02em}

  /* ---- 배너 ---- */
  .banner{border-radius:var(--r-md); padding:10px 14px; font-size:var(--fs-body); margin-bottom:12px;
    display:flex; gap:10px; align-items:center; line-height:1.5}
  .banner b{font-weight:var(--w-semi)}
  .banner .spacer{flex:1}
  .banner.info{background:var(--brand-bg); border:1px solid var(--brand-line)}
  .banner.risk{background:var(--bad-bg); border:1px solid var(--bad-line); color:var(--bad)}
  .banner.warn{background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn)}
  .banner.ok{background:var(--ok-bg); border:1px solid var(--ok-line); color:var(--ok)}
  .banner .tag{border:1px solid currentColor; border-radius:var(--r-pill); padding:3px 9px;
    font-size:var(--fs-caption); font-weight:var(--w-semi); white-space:nowrap}

  /* ---- KPI ---- */
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px}
  .kpi{background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r-md);
    padding:12px 14px; box-shadow:var(--shadow)}
  .kpi .k{font-size:var(--fs-caption); color:var(--muted); font-weight:var(--w-med); margin-bottom:5px}
  .kpi .v{font-size:var(--fs-title2); font-weight:var(--w-bold); font-variant-numeric:tabular-nums; white-space:nowrap}
  .kpi .d{font-size:var(--fs-caption); color:var(--muted-2); margin-top:3px}
  .kpi .v.pos{color:var(--ok)} .kpi .v.neg{color:var(--bad)} .kpi .v.brand{color:var(--brand)}
  .kpi.clickable{cursor:pointer} .kpi.clickable:hover{border-color:var(--brand-line); background:var(--brand-bg)}
  .kpi.alert{border-color:var(--bad-line); background:var(--bad-bg)}
  .kpi.alert .v{color:var(--bad)}

  /* ---- 툴바 ---- */
  .toolbar{display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:12px;
    background:#fff; border:1px solid var(--line-soft); border-radius:var(--r-md); padding:9px 10px; box-shadow:var(--shadow)}
  .toolbar input[type=search],.toolbar input[type=text],.toolbar select{
    padding:6px 10px; border:1px solid var(--line); border-radius:var(--r-sm); font-size:var(--fs-body);
    background:#fff; min-height:32px}
  .toolbar input[type=search]{flex:1; min-width:160px}
  .toolbar .grp{display:flex; align-items:center; gap:5px}
  .toolbar label{font-size:var(--fs-caption); font-weight:var(--w-med); color:var(--muted)}
  .toolbar .spacer{flex:1}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; background:#fff}
  .seg button{border:0; background:transparent; padding:6px 11px; font-size:var(--fs-footnote);
    font-weight:var(--w-semi); color:var(--muted)}
  .seg button.on{background:var(--brand); color:#fff}
  .seg button:not(.on):hover{background:var(--fill)}

  /* ---- 시트 ---- */
  .sheet-scroll{overflow:auto; max-height:calc(100vh - 300px); border:1px solid var(--line-soft);
    border-radius:var(--r-md); background:#fff; box-shadow:var(--shadow)}
  table.sheet{border-collapse:separate; border-spacing:0; font-size:var(--fs-footnote);
    width:max-content; min-width:100%; table-layout:fixed}
  table.sheet th,table.sheet td{border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    overflow:hidden; line-height:1.2}
  table.sheet td{vertical-align:middle}
  table.sheet tbody tr{height:31px}
  table.sheet thead th{position:sticky; top:0; z-index:5; background:var(--fill-2); color:var(--ink-2);
    font-weight:var(--w-semi); text-align:left; padding:7px 8px; white-space:nowrap; user-select:none; position:sticky}
  table.sheet thead th .auto{font-weight:var(--w-med); font-size:var(--fs-caption); color:var(--brand);
    background:var(--brand-bg); padding:0 4px; border-radius:var(--r-sm); margin-left:3px}
  table.sheet thead th[draggable=true]{cursor:grab}
  table.sheet thead th.dragging-col{opacity:.45}
  table.sheet thead th.col-drop{box-shadow:inset 3px 0 0 var(--brand)}
  table.sheet thead th.col-drop.drop-after{box-shadow:inset -3px 0 0 var(--brand)}
  table.sheet th.rownum,table.sheet td.rownum{position:sticky; left:0; z-index:4; background:var(--fill-2);
    color:var(--muted); text-align:center; padding:0 5px; font-variant-numeric:tabular-nums}
  table.sheet thead th.rownum{z-index:6}
  table.sheet td.rownum{cursor:ns-resize; user-select:none}
  table.sheet td input,table.sheet td select{width:100%; border:0; background:transparent; padding:3px 6px;
    height:24px; line-height:18px; font:inherit; color:var(--ink); outline:0}
  table.sheet td input:focus,table.sheet td select:focus{background:#fff; box-shadow:inset 0 0 0 2px var(--brand)}
  table.sheet td.calc{padding:4px 7px; line-height:18px; background:var(--bg-elev); color:var(--muted);
    white-space:nowrap; text-overflow:ellipsis; font-variant-numeric:tabular-nums; text-align:right}
  table.sheet td.calc.pos{color:var(--ok); font-weight:var(--w-med)}
  table.sheet td.calc.neg{color:var(--bad); font-weight:var(--w-med)}
  table.sheet td input.num-in{text-align:right; font-variant-numeric:tabular-nums}
  table.sheet tbody tr:hover td{background:var(--row-hover)}
  table.sheet tbody tr.r-ordered td{background:#f4f9ff}
  table.sheet tbody tr.r-invoiced td{background:#f3fbf6}
  table.sheet tbody tr.r-uploaded td{background:var(--ok-row)}
  table.sheet tbody tr.r-cs td{background:var(--warn-row)}
  table.sheet tbody tr.r-risk td{background:var(--bad-row)}
  table.sheet tbody tr.r-risk td.rownum{background:#ffd9df; color:var(--bad); font-weight:var(--w-semi)}
  table.sheet tbody tr.r-loss td{color:var(--muted-2)}
  table.sheet tbody tr.sel td{box-shadow:inset 0 1px 0 var(--brand-line), inset 0 -1px 0 var(--brand-line)}
  table.sheet td.act{text-align:center; padding:0 3px}
  table.sheet td.del{text-align:center; padding:0}
  table.sheet td.del button{border:0; background:transparent; color:var(--bad); padding:5px; opacity:.5}
  table.sheet td.del button:hover{opacity:1}
  table.sheet td.empty{padding:36px; text-align:center; color:var(--muted); border-right:0}
  table.sheet td.copy-cell{cursor:pointer}
  table.sheet td.copy-cell input{cursor:pointer}
  table.sheet td.copy-cell:hover{background:var(--brand-bg)}
  table.sheet tr.group-row td{background:var(--brand-bg)!important; font-weight:var(--w-semi);
    padding:7px 12px; border-top:1px solid var(--brand-line)}
  table.sheet tr.group-row span{margin-left:12px; color:var(--muted); font-weight:var(--w-med)}
  .col-resizer{position:absolute; top:0; right:-3px; width:7px; height:100%; cursor:col-resize; z-index:20}
  th.resizable{position:relative}
  body.resizing{user-select:none}
  .risk-dot{display:inline-flex; align-items:center; justify-content:center; width:100%;
    font-size:var(--fs-caption); font-weight:var(--w-semi); color:var(--bad)}
  .risk-dot.warn{color:var(--warn)}
  .step-chip{display:inline-block; padding:2px 7px; border-radius:var(--r-pill); font-size:var(--fs-caption);
    font-weight:var(--w-semi); white-space:nowrap}
  .step-new{background:var(--fill); color:var(--muted)}
  .step-ordered{background:var(--brand-bg); color:var(--brand)}
  .step-invoiced{background:#eaf6fb; color:#0a6a8a}
  .step-uploaded{background:var(--ok-bg); color:var(--ok)}
  .sheet-check{display:flex; align-items:center; justify-content:center; height:100%}
  .sheet-check input{width:15px; height:15px; accent-color:var(--brand)}
  .go-pair{display:flex; gap:2px; align-items:center; justify-content:center}
  .go-btn{flex:1; min-width:0; border:0; background:transparent; color:var(--brand); border-radius:var(--r-sm);
    font-size:var(--fs-caption); font-weight:var(--w-semi); padding:4px 2px; line-height:1.2; white-space:nowrap}
  .go-btn:hover{background:var(--brand-bg)}
  .go-btn.done{color:var(--ok)} .go-btn.done:hover{background:var(--ok-bg)}

  /* ---- 일반 표 ---- */
  .data-scroll{overflow:auto; border:1px solid var(--line-soft); border-radius:var(--r-md);
    box-shadow:var(--shadow); background:#fff; max-height:calc(100vh - 260px)}
  table.data{width:100%; border-collapse:collapse; font-size:var(--fs-body)}
  table.data th,table.data td{padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap}
  table.data thead th{background:var(--fill-2); font-size:var(--fs-footnote); color:var(--ink-2);
    font-weight:var(--w-semi); position:sticky; top:0; z-index:2}
  table.data tbody tr:hover td{background:var(--bg-elev)}
  table.data td.num,table.data th.num{text-align:right; font-variant-numeric:tabular-nums}
  table.data td.pos{color:var(--ok)} table.data td.neg{color:var(--bad)}
  table.data td.wrap{white-space:normal; min-width:220px}
  table.data tfoot td{background:var(--fill-2); font-weight:var(--w-semi); border-top:1px solid var(--line)}
  table.data input,table.data select,table.data textarea{width:100%; border:1px solid transparent;
    border-radius:var(--r-sm); padding:5px 7px; font-size:var(--fs-footnote); background:transparent; min-width:70px}
  table.data input:hover,table.data select:hover,table.data textarea:hover{border-color:var(--line-soft); background:#fff}
  table.data input:focus,table.data select:focus,table.data textarea:focus{background:#fff; border-color:var(--brand)}
  table.data input.num-in{text-align:right; font-variant-numeric:tabular-nums}
  table.data tr.risk-row td{background:var(--bad-row)}
  .mask{font-family:ui-monospace,Menlo,monospace; letter-spacing:.06em}

  /* ---- 차트 ---- */
  .chart-wrap{background:#fff; border:1px solid var(--line-soft); border-radius:var(--r-md);
    box-shadow:var(--shadow); padding:14px 16px; margin-bottom:14px}
  .chart-wrap h3{margin:0 0 2px; font-size:var(--fs-body); font-weight:var(--w-semi)}
  .chart-wrap .cap{margin:0 0 12px; font-size:var(--fs-caption); color:var(--muted)}
  .bars{display:flex; align-items:flex-end; gap:3px; height:132px; padding-top:6px}
  .bars .bar{flex:1; min-width:4px; display:flex; flex-direction:column; justify-content:flex-end;
    align-items:center; height:100%; position:relative}
  .bars .bar i{display:block; width:100%; background:var(--brand-line); border-radius:3px 3px 0 0; transition:height .2s}
  .bars .bar em{display:block; width:100%; background:var(--brand); border-radius:3px 3px 0 0}
  .bars .bar:hover i,.bars .bar:hover em{background:var(--brand-d)}
  .bars .bar span{position:absolute; bottom:-16px; font-size:9px; color:var(--muted-2); white-space:nowrap}
  .chart-axis{display:flex; justify-content:space-between; font-size:var(--fs-caption);
    color:var(--muted-2); margin-top:20px; border-top:1px solid var(--line-soft); padding-top:6px}
  .legend{display:flex; gap:14px; font-size:var(--fs-caption); color:var(--muted); margin-top:8px}
  .legend span{display:inline-flex; align-items:center; gap:5px}
  .legend i{width:9px; height:9px; border-radius:2px; display:inline-block}

  /* ---- 그리드 레이아웃 ---- */
  .split-2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .split-3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}

  /* ---- 모달 ---- */
  .modal-bg{position:fixed; inset:0; background:rgba(20,25,35,.45); z-index:50; display:flex;
    align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto}
  .modal{background:#fff; border-radius:var(--r-md); width:100%; max-width:720px; box-shadow:var(--shadow-pop)}
  .modal.wide{max-width:1000px}
  .modal .mhead{display:flex; align-items:center; padding:15px 20px; border-bottom:1px solid var(--line);
    background:var(--bg-elev); border-radius:var(--r-md) var(--r-md) 0 0}
  .modal .mhead h2{margin:0; font-size:var(--fs-title3); font-weight:var(--w-semi)}
  .modal .mhead .spacer{flex:1}
  .modal .mbody{padding:20px; max-height:70vh; overflow:auto}
  .modal .mfoot{padding:13px 20px; border-top:1px solid var(--line); background:var(--bg-elev);
    border-radius:0 0 var(--r-md) var(--r-md); display:flex; gap:8px; justify-content:flex-end}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:var(--fs-footnote); font-weight:var(--w-semi); margin-bottom:5px}
  .field .hint{font-size:var(--fs-caption); color:var(--muted); margin-top:4px}
  .field input,.field select,.field textarea{width:100%; padding:8px 10px; border:1px solid var(--line);
    border-radius:var(--r-sm); font-size:var(--fs-body)}
  .field textarea{min-height:90px; resize:vertical; font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-footnote)}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .set-sec{border-top:1px solid var(--line-soft); padding-top:16px; margin-top:16px}
  .set-sec:first-child{border-top:0; padding-top:0; margin-top:0}
  .set-sec h3{margin:0 0 3px; font-size:var(--fs-sub); font-weight:var(--w-semi)}
  .set-sec .d{color:var(--muted); font-size:var(--fs-footnote); margin:0 0 12px}

  /* ---- 드롭존 ---- */
  .dropzone{background:var(--card); border:1px dashed var(--line); border-radius:var(--r-md);
    padding:26px 20px; text-align:center; transition:.15s}
  .dropzone.drag{border-color:var(--brand); background:var(--brand-bg)}
  .dropzone h3{margin:0 0 4px; font-size:var(--fs-sub); font-weight:var(--w-semi)}
  .dropzone p{margin:0 0 12px; color:var(--muted)}

  /* ---- 빈 상태 ---- */
  .empty{text-align:center; padding:46px 20px; background:var(--card); border:1px solid var(--line-soft);
    border-radius:var(--r-md); box-shadow:var(--shadow)}
  .empty h3{margin:0 0 6px; font-size:var(--fs-title3); font-weight:var(--w-semi)}
  .empty p{margin:0 auto; color:var(--muted); max-width:460px; line-height:1.6}
  .empty .btn{margin-top:16px}

  /* ---- 토스트 ---- */
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:rgba(29,29,31,.93); color:#fff; padding:10px 20px; border-radius:var(--r-md);
    font-size:var(--fs-body); font-weight:var(--w-med); opacity:0; pointer-events:none;
    transition:.2s; z-index:99; box-shadow:var(--shadow-pop); max-width:80vw; text-align:center}

    ["주방용품", ["냄비", "프라이팬", "물병", "텀블러", "컵", "그릇", "수저", "도마", "주방", "밀폐용기", "스테인리스"]],
    ["물티슈", ["물티슈"]],
    ["유아물티슈", ["아기물티슈", "유아물티슈"]],
    ["기저귀/분유", ["기저귀", "분유"]],
    ["욕실/세탁(세제샴푸등)", ["세제", "샴푸", "린스", "바디워시", "섬유유연제", "비누", "치약칫솔", "세탁"]],
    ["치약", ["치약"]],
    ["화장품", ["스킨", "로션", "크림", "에센스", "마스크팩", "선크림", "쿠션", "립"]],
    ["패션의류/패션잡화", ["티셔츠", "셔츠", "바지", "원피스", "자켓", "코트", "속옷", "양말", "가방", "신발", "모자"]],
    ["건강식품/다이어트", ["유산균", "비타민", "홍삼", "오메가", "콜라겐", "다이어트", "영양제"]],
    ["계절가전", ["선풍기", "히터", "가습기", "제습기", "온풍기", "에어컨"]],
    ["펫/가구/홈인테리어/문구/사무용품", ["강아지", "고양이", "반려", "의자", "책상", "선반", "수납", "문구", "볼펜", "노트"]],
    ["공구/철물/조명/배선/전기코드류", ["공구", "드라이버", "전선", "멀티탭", "조명", "전구", "테이프"]],
    ["방향/탈취/살충제", ["방향제", "탈취", "살충", "모기", "디퓨저"]],
    ["차량가전용품", ["차량용", "자동차", "카매트", "블랙박스"]]
  ];

  /* ---------------------------------------------------------------
   * 4. 숫자·문자 유틸
   * --------------------------------------------------------------- */
  function toNumber(v) {
    if (typeof v === "number") return isFinite(v) ? v : 0;
    if (v === null || v === undefined) return 0;
    var s = String(v).replace(/[^0-9.\-]/g, "");
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }
  function hasValue(v) { return v !== null && v !== undefined && String(v).trim() !== ""; }
  function round2(n) { return Math.round(n * 100) / 100; }
  function norm(s) { return String(s == null ? "" : s).replace(/\s+/g, "").toLowerCase(); }

  /* 날짜 문자열/직렬값 → 'YYYY-MM-DD' */
  function dateOnly(v) {
    if (v === null || v === undefined || v === "") return "";
    if (typeof v === "number") {
      var d = new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * 86400000);
      return d.toISOString().slice(0, 10);
    }
    var s = String(v).trim();
    var m = s.match(/(\d{4})[-./년\s]*(\d{1,2})[-./월\s]*(\d{1,2})/);
    if (m) return m[1] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[3]).slice(-2);
    m = s.match(/^(\d{2})[-./](\d{1,2})[-./](\d{1,2})/);
    if (m) return "20" + m[1] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[3]).slice(-2);
    return "";
  }
  function monthOf(v) { var d = dateOnly(v); return d ? d.slice(0, 7) : ""; }

  /* 'YYYY-MM-DD HH:mm' / Date / 직렬값 → 엑셀 직렬값(숫자). 실패하면 null */
  function toSerial(v) {
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return isFinite(v) ? v : null;
    var s = String(v).trim();
    var m = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
    if (!m) {
      var d2 = dateOnly(s);
      if (!d2) return null;
      m = d2.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return null;
    }
    var utc = Date.UTC(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
    return (utc - Date.UTC(1899, 11, 30)) / 86400000;
  }

  /* ---------------------------------------------------------------
   * 5. 수수료율 조회
   * --------------------------------------------------------------- */
  function guessCategory(productName) {
    var n = String(productName || "");
    for (var i = 0; i < CATEGORY_KEYWORDS.length; i++) {
      var kws = CATEGORY_KEYWORDS[i][1];
      for (var k = 0; k < kws.length; k++) if (n.indexOf(kws[k]) !== -1) return CATEGORY_KEYWORDS[i][0];
    }
    return "";
  }
  // fees: [{site, category, rate, rateVat}]
  function lookupFee(fees, site, category) {
    var list = fees && fees.length ? fees : DEFAULT_FEES;
    var s = norm(site), c = norm(category);
    var i;
    if (c) {
      for (i = 0; i < list.length; i++) {
        if (norm(list[i].category) === c && (!s || norm(list[i].site) === s)) return list[i];
      }
      for (i = 0; i < list.length; i++) if (norm(list[i].category) === c) return list[i];
    }
    if (s) for (i = 0; i < list.length; i++) if (norm(list[i].site) === s && !list[i].category) return list[i];
    return null;
  }

  /* ---------------------------------------------------------------
   * 6. 마진 계산 — 워크북 수식과 동일
   *    결제기준가 = 판매가 x (1 - 수수료율VAT)
   *    순마진     = (결제기준가 + 배송비순액 - 구매금액 - 에누리) / 1.1
   *    부가세     = 순마진 x 10%
   *    마진률     = 순마진 / 판매가
   *    올라수수료 = 판매가 x 0.96%
   * --------------------------------------------------------------- */
  var OLLA_RATE = 0.0096;

  function computeOrder(o, ctx) {
    ctx = ctx || {};
    var fees = ctx.fees || DEFAULT_FEES;
    var ollaRate = ctx.ollaRate == null ? OLLA_RATE : ctx.ollaRate;

    o.qty = Math.max(1, Math.round(toNumber(o.qty) || 1));
    o.settleSite = o.settleSite || o.siteName || "";
    if (!hasValue(o.category)) o.category = guessCategory(o.productName);

    var manualRate = ctx.manualRates && ctx.manualRates[o.id];
    var fee = lookupFee(fees, o.settleSite || o.siteName, o.category);
    var rate = manualRate != null ? manualRate : (fee ? fee.rate : null);
    var rateVat = rate == null ? null : Math.round(rate * 1.1 * 1e6) / 1e6;

    o.feeRate = rate;
    o.feeRateVat = rateVat;

    var salePrice = toNumber(o.salePrice);
    var shipFee = toNumber(o.shipFee);
    var discount = toNumber(o.discount);
    var buyAmount = hasValue(o.buyAmount) ? toNumber(o.buyAmount)
      : toNumber(o.buyUnitPrice) * o.qty;

    o.revenue = salePrice;
    o.saleDate = dateOnly(o.saleDate) || dateOnly(o.orderedAt) || dateOnly(o.collectedAt);
    o.settleOrderNo = String(o.siteOrderNo || "").trim().split(/\s+/)[0] || "";
    o.pointOut = toNumber(o.point);

    if (rateVat == null) {
      o.settleBase = null; o.fee = null; o.shipNet = null;
      o.netMargin = null; o.vat = null; o.marginRate = null;
      o.ollaFee = round2(salePrice * ollaRate);
      o.netProfit = null;
      o.marginReady = false;
      return o;
    }

    o.settleBase = round2(salePrice * (1 - rateVat));
    o.fee = round2(salePrice * rateVat);
    o.shipNet = round2(shipFee * (1 - rateVat));
    o.ollaFee = round2(salePrice * ollaRate);

    if (!buyAmount) {
      o.netMargin = null; o.vat = null; o.marginRate = null; o.netProfit = null;
      o.marginReady = false;
      return o;
    }
    var gross = o.settleBase + o.shipNet - buyAmount - discount;
    o.netMargin = round2(gross / 1.1);
    o.vat = round2(o.netMargin * 0.1);
    o.marginRate = salePrice ? o.netMargin / salePrice : null;
    o.netProfit = round2(o.netMargin + o.pointOut);
    o.marginReady = true;
    return o;
  }

  /* ---------------------------------------------------------------
   * 7. 블랙리스트 판정
   *    - 이름 완전일치(마스킹 '*' 는 한 글자 와일드카드)
   *    - 주소는 공백·기호 제거 후 포함관계 또는 핵심 토큰 2개 이상 일치
   * --------------------------------------------------------------- */
  function normName(s) {
    return String(s || "").replace(/[\s()[\]{}]/g, "").replace(/[·.,]/g, "");
  }
  function splitNames(s) {
    return normName(s).split(/[\/|]/).filter(Boolean);
  }
  function normAddr(s) {
    return String(s || "")
      .replace(/\(.*?\)/g, " ")
      .replace(/[^0-9A-Za-z가-힣]/g, "")
      .replace(/특별자치시|특별자치도|특별시|광역시/g, "")
      .toLowerCase();
  }
  function addrTokens(s) {
    return String(s || "")
      .replace(/\(.*?\)/g, " ")
      .replace(/[^0-9A-Za-z가-힣*\-]/g, " ")
      .split(/\s+/)
      .map(function (x) { return x.toLowerCase(); })
      .filter(function (x) { return x.length >= 2; });
  }
  function wildRe(token) {
    return new RegExp("^" + token.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".") + "$");
  }
  // 번지·동·호수처럼 숫자가 든 토큰: 정확히(마스킹은 와일드카드로) 같아야 인정
  function exactHit(token, list) {
    if (token.indexOf("*") !== -1) {
      var re = wildRe(token);
      for (var i = 0; i < list.length; i++) if (re.test(list[i])) return true;
      return false;
    }
    return list.indexOf(token) !== -1;
  }
  // 지명·건물명 토큰: 포함 관계까지 인정 (인천 ⊂ 인천광역시)
  function looseHit(token, list) {
    if (token.indexOf("*") !== -1) {
      var re2 = wildRe(token);
      for (var k = 0; k < list.length; k++) if (re2.test(list[k])) return true;
      return false;
    }
    for (var j = 0; j < list.length; j++) {
      var t = list[j];
      if (t === token) return true;
      if (t.indexOf(token) !== -1 || token.indexOf(t) !== -1) return true;
    }
    return false;
  }

  function nameMatches(orderName, blName) {
    var a = normName(orderName);
    if (!a) return false;
    var candidates = splitNames(blName);
    for (var i = 0; i < candidates.length; i++) {
      var b = candidates[i];
      if (!b) continue;
      if (b.indexOf("*") !== -1) {
        var re = new RegExp("^" + b.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".") + "$");
        if (re.test(a)) return true;
      } else if (a === b) return true;
    }
    return false;
  }

  /* 주소 일치 판정
   * "경기도 용인시 기흥구" 처럼 행정구역만 겹치는 것은 일치로 보지 않습니다.
   *   - 번지·동·호수처럼 숫자가 들어간 토큰은 전부 맞아야 함
   *   - 숫자 토큰이 없는 등록(예: "인천 계양구 하나아파트")은 모든 토큰이 맞아야 함
   */
  function addrMatches(orderAddr, blAddr) {
    var a = normAddr(orderAddr), b = normAddr(blAddr);
    if (!a || !b || b.length < 6) return false;
    if (a.indexOf(b) !== -1 || b.indexOf(a) !== -1) return true;

    var ta = addrTokens(orderAddr), tb = addrTokens(blAddr);
    if (!ta.length || tb.length < 2) return false;

    var digits = [], plain = [];
    tb.forEach(function (t) { (/[0-9]/.test(t) ? digits : plain).push(t); });

    var plainHits = 0;
    plain.forEach(function (t) { if (looseHit(t, ta)) plainHits++; });

    if (digits.length) {
      for (var i = 0; i < digits.length; i++) if (!exactHit(digits[i], ta)) return false;
      // 지명도 대부분 맞아야 함 — 번지 숫자만 우연히 겹치는 오탐 방지
      var need = plain.length >= 3 ? plain.length - 1 : plain.length;
      return plainHits >= need;
    }
    // 숫자 없는 등록은 토큰이 3개 이상이고 전부 맞을 때만 ("인천 연수구" 같은 광역 표현 제외)
    return plain.length >= 3 && plainHits === plain.length;
  }

  // blacklist: [{name, address, phone, memo}]
  // 반환: { level:"danger"|"warn"|"", reasons:[..], hits:[{...}] }
  function checkBlacklist(o, blacklist) {
    var out = { level: "", reasons: [], hits: [] };
    if (!blacklist || !blacklist.length) return out;
    var name = o.recipient || o.buyerName || "";
    var addr = o.address || "";
    var phone = String(o.recvPhone || o.recvTel || "").replace(/[^0-9]/g, "");
    for (var i = 0; i < blacklist.length; i++) {
      var b = blacklist[i];
      if (!b) continue;
      var nHit = b.name ? nameMatches(name, b.name) : false;
      var aHit = b.address ? addrMatches(addr, b.address) : false;
      // 마스킹 이름(김성*)은 추정이라, 주소가 등록돼 있으면 주소까지 맞아야 경고합니다
      if (nHit && String(b.name).indexOf("*") !== -1 && b.address && !aHit) nHit = false;
      var pHit = false;
      if (b.phone) {
        var bp = String(b.phone).replace(/[^0-9]/g, "");
        pHit = bp.length >= 8 && phone.length >= 8 && phone.slice(-8) === bp.slice(-8);
      }
      if (!nHit && !aHit && !pHit) continue;
      var level = "warn";
      var masked = String(b.name || "").indexOf("*") !== -1;
      if ((nHit && aHit) || pHit) level = "danger";
      // 주소가 없는 등록은 이름 자체가 블랙 — 다만 마스킹 이름(김성*)은 추정이라 '주의'까지만
      else if (nHit && !b.address && !masked) level = "danger";
      var why = [];
      if (nHit) why.push("수령자명 '" + name + "'");
      if (aHit) why.push("배송지 일치");
      if (pHit) why.push("연락처 일치");
      out.hits.push({ entry: b, level: level, why: why.join(" · ") });
      out.reasons.push((b.name || "(이름없음)") + " — " + why.join(" · "));
      if (level === "danger" || !out.level) out.level = level === "danger" ? "danger" : (out.level || "warn");
    }
    return out;
  }

  /* ---------------------------------------------------------------
   * 8. 진행 상태 판정 (딸깍 처리용 단계)
   * --------------------------------------------------------------- */
  var STEPS = [
    { key: "new",      label: "신규" },
    { key: "ordered",  label: "발주완료" },
    { key: "invoiced", label: "송장입력" },
    { key: "uploaded", label: "업로드완료" }
  ];
  function stepOf(o) {
    if (norm(o.invoiceUploaded) === "완료") return "uploaded";
    if (hasValue(o.invoiceNo)) return "invoiced";
    if (String(o.orderedYn || "").toUpperCase() === "O") return "ordered";
    return "new";
  }
  function stepLabel(k) {
    for (var i = 0; i < STEPS.length; i++) if (STEPS[i].key === k) return STEPS[i].label;
    return "신규";
  }

  /* ---------------------------------------------------------------
   * 9. 공용 export
   * --------------------------------------------------------------- */
  var api = {
    ORDER_COLUMNS: ORDER_COLUMNS,
    COLUMN_ALIASES: COLUMN_ALIASES,
    COURIERS: COURIERS,
    DEFAULT_FEES: DEFAULT_FEES,
    CATEGORY_KEYWORDS: CATEGORY_KEYWORDS,
    OLLA_RATE: OLLA_RATE,
    STEPS: STEPS,
    courierByCode: courierByCode,
    courierByName: courierByName,
    normalizeCourier: normalizeCourier,
    toNumber: toNumber,
    hasValue: hasValue,
    round2: round2,
    norm: norm,
    dateOnly: dateOnly,
    monthOf: monthOf,
    toSerial: toSerial,
    guessCategory: guessCategory,
    lookupFee: lookupFee,
    computeOrder: computeOrder,
    checkBlacklist: checkBlacklist,
    nameMatches: nameMatches,
    addrMatches: addrMatches,
    stepOf: stepOf,
    stepLabel: stepLabel,
    colByKey: function (key) {
      for (var i = 0; i < ORDER_COLUMNS.length; i++) if (ORDER_COLUMNS[i].key === key) return ORDER_COLUMNS[i];
      return null;
    },
    labelOf: function (key) { var c = api.colByKey(key); return c ? c.label : key; }
  };

  global.OrderCore = api;
  if (typeof module !== "undefined" && module.exports) module.exports = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ===== xlsx-lite.js ===== */
/* =====================================================================
 * xlsx-lite.js — 의존성 없는 엑셀(.xlsx) 읽기/쓰기 엔진
 *
 * SheetJS 같은 외부 라이브러리 없이 브라우저 표준만으로 동작합니다.
 *   읽기 : ZIP 파싱 + DecompressionStream('deflate-raw')
 *   쓰기 : ZIP(무압축 저장) + 서식/수식/드롭다운/조건부서식/틀고정까지 지원
 *   날짜 : numFmt 감지 → 'YYYY-MM-DD HH:mm' 문자열로 변환
 *
 * 외부 네트워크 호출 0건. 모든 처리는 브라우저(또는 node) 안에서 끝납니다.
 * 브라우저와 node 양쪽에서 쓰입니다(node에서는 엑셀 양식 파일 생성에 사용).
 * ===================================================================== */
(function (global) {
  "use strict";

  var td = new TextDecoder("utf-8");
  var te = new TextEncoder();

  function u16(dv, p) { return dv.getUint16(p, true); }
  function u32(dv, p) { return dv.getUint32(p, true); }

  var CTRL = /[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g;

  function unescapeXml(s) {
    if (s.indexOf("&") === -1) return s;
    return s.replace(/&(#x?[0-9A-Fa-f]+|amp|lt|gt|quot|apos);/g, function (m, g) {
      if (g === "amp") return "&";
      if (g === "lt") return "<";
      if (g === "gt") return ">";
      if (g === "quot") return '"';
      if (g === "apos") return "'";
      if (g.charAt(0) === "#") {
        var code = g.charAt(1) === "x" ? parseInt(g.slice(2), 16) : parseInt(g.slice(1), 10);
        return isNaN(code) ? m : String.fromCodePoint(code);
      }
      return m;
    });
  }
  function escapeXml(s) {
    return String(s).replace(CTRL, "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c];
    });
  }

  function colIndex(ref) {
    var n = 0;
    for (var i = 0; i < ref.length; i++) {
      var c = ref.charCodeAt(i);
      if (c < 65 || c > 90) break;
      n = n * 26 + (c - 64);
    }
    return n - 1;
  }
  function colName(idx) {
    var s = "", n = idx + 1;
    while (n > 0) { var r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
    return s;
  }

  /* ---------------- 엑셀 날짜 직렬값 ---------------- */
  function serialToDate(serial) {
    var days = Math.floor(serial);
    var ms = Math.round((serial - days) * 86400 * 1000);
    return new Date(Date.UTC(1899, 11, 30) + days * 86400000 + ms);
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }

    }

    var cf = "";
    (s.condFormats || []).forEach(function (c, idx) {
      cf += '<conditionalFormatting sqref="' + c.sqref + '">' + (c.rules || []).map(function (r, ri2) {

        var f1 = v.formula ? v.formula : '"' + (v.values || []).join(",") + '"';
        return '<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="0" sqref="' + v.sqref + '">' +

  function buildBytes(sheets, definedNames) {

    add("[Content_Types].xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +

      '<Default Extension="xml" ContentType="application/xml"/>' +

      sheets.map(function (s, i) {

      }).join("") + "</Types>");

    add("_rels/.rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +

        return '<definedName name="' + escapeXml(k) + '">' + escapeXml(definedNames[k]) + "</definedName>";
      }).join("") + "</definedNames>";
    }
    add("xl/workbook.xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      sheets.map(function (s, i) {

      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map(function (s, i) {
        return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>';
      }).join("") +
      '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      "</Relationships>");

<script>
/* ===== import.js ===== */
/* =====================================================================
 * import.js — 워크북/붙여넣기 → 표준 모델 변환
 *
 * 2026-09 최신 워크북(설명·블랙리스트·DAY·MON·2.주문서·3.계정카드정보·
 * 수수료·CS·4.송장업로드리스트·사입)을 통째로 읽어 앱 상태로 바꿉니다.
 * 쿠팡 발주서처럼 열 이름이 다른 파일은 별칭 매핑으로 흡수합니다.
 * ===================================================================== */
(function (global) {
  "use strict";

  var Core = global.OrderCore || (typeof require !== "undefined" ? require("./core.js") : null);
  var COLS = Core.ORDER_COLUMNS;

  function norm(s) { return String(s == null ? "" : s).replace(/\s+/g, "").toLowerCase(); }
  function cell(row, i) {
    if (!row || i == null || i < 0) return "";
    var v = row[i];
    return v === undefined || v === null ? "" : v;
  }
  function str(v) { return String(v === undefined || v === null ? "" : v).trim(); }
  function nonEmpty(row) { return (row || []).some(function (c) { return str(c) !== ""; }); }

  /* ---------- 헤더 행 찾기 ---------- */
  function findHeaderRow(rows, labels, limit) {
    var want = labels.map(norm);
    var best = -1, bestScore = 1;
    for (var r = 0; r < Math.min(rows.length, limit || 12); r++) {
      var score = 0, seen = {};
      (rows[r] || []).forEach(function (c) {
        var n = norm(c);
        if (!n || seen[n]) return;
        if (want.indexOf(n) !== -1) { score++; seen[n] = 1; }
      });
      if (score > bestScore) { bestScore = score; best = r; }
    }
    return best;
  }

  /* ---------- 주문서 열 매핑 ---------- */
  function mapOrderColumns(header) {
    var map = {}, used = {};
    // 1) 위치 그대로 맞는지 확인 (최신 워크북 = 53열 순서 동일)
    var hits = 0;
    for (var i = 0; i < COLS.length && i < header.length; i++) {
      if (norm(header[i]) === norm(COLS[i].label)) hits++;
    }
    if (hits >= 18) {
      COLS.forEach(function (c, idx) { if (idx < header.length) map[c.key] = idx; });
      map.__positional = true;
      return map;
    }
    // 2) 이름(별칭) 매핑 — 먼저 나온 열이 우선
    var aliases = Core.COLUMN_ALIASES;
    Object.keys(aliases).forEach(function (key) {
      var list = aliases[key];
      for (var a = 0; a < list.length; a++) {
        var target = norm(list[a]);
        for (var h = 0; h < header.length; h++) {
          if (used[h]) continue;
          if (norm(header[h]) === target) { map[key] = h; used[h] = 1; return; }
        }
      }
    });
    return map;
  }

  var newIdSeq = 0;
  function newId() {
    newIdSeq++;
    return "o" + Date.now().toString(36) + "_" + newIdSeq.toString(36);
  }

  function buildOrder(row, map) {
    var o = { id: newId(), raw: {} };
    COLS.forEach(function (c) {
      var idx = map[c.key];
      if (idx === undefined) return;
      var v = cell(row, idx);
      if (c.type === "money" || c.type === "int") o[c.key] = v === "" ? "" : Core.toNumber(v);
      else o[c.key] = str(v);
    });
    o.courierCode = o.courierCode ? Core.normalizeCourier(o.courierCode) : "";
    o.orderedYn = String(o.orderedYn || "").toUpperCase() === "O" ? "O"
      : (String(o.orderedYn || "").toUpperCase() === "X" ? "X" : "");
    o.qty = Math.max(1, Math.round(Core.toNumber(o.qty) || 1));
    o.memoLog = [];
    return o;
  }

  /* ---------- 2.주문서 ---------- */
  function readOrders(rows) {
    if (!rows || !rows.length) return [];
    var labels = COLS.map(function (c) { return c.label; });
    var hr = findHeaderRow(rows, labels, 12);
    if (hr < 0) hr = 0;
    var map = mapOrderColumns(rows[hr] || []);
    if (map.productName === undefined && map.siteOrderNo === undefined) return [];
    var out = [];
    for (var r = hr + 1; r < rows.length; r++) {
      var row = rows[r];
      if (!nonEmpty(row)) continue;
      var name = str(cell(row, map.productName));
      var no = str(cell(row, map.siteOrderNo));
      if (!name && !no) continue;
      out.push(buildOrder(row, map));
    }
    return out;
  }

  /* ---------- 블랙리스트 ---------- */
  function readBlacklist(rows) {
    if (!rows || !rows.length) return [];
    var start = 0;
    var h = findHeaderRow(rows, ["이름", "주소", "연락처", "사유"], 3);
    if (h >= 0) start = h + 1;
    var seen = {}, out = [];
    for (var r = start; r < rows.length; r++) {
      var row = rows[r] || [];
      var name = str(cell(row, 0));
      var addr = str(cell(row, 1));
      var phone = str(cell(row, 2));
      if (!name && !addr) continue;
      var key = norm(name) + "|" + norm(addr);
      if (seen[key]) continue;
      seen[key] = 1;
      out.push({ name: name, address: addr, phone: phone, memo: str(cell(row, 3)), addedAt: str(cell(row, 4)) });
    }
    return out;
  }

  /* ---------- 수수료 ---------- */
  function readFees(rows) {
    if (!rows || !rows.length) return [];
    var rateCol = -1, headRow = -1;
    for (var r = 0; r < Math.min(rows.length, 12) && rateCol < 0; r++) {
      var row = rows[r] || [];
      for (var c = 0; c < row.length; c++) {
        if (norm(row[c]) === "수수료율" && norm(cell(row, c + 1)).indexOf("vat") !== -1) {
          rateCol = c; headRow = r; break;
        }
      }
    }
    if (rateCol < 0) return [];
    var catCol = rateCol - 1, siteCol = rateCol - 2;
    if (norm(cell(rows[headRow], catCol)) !== "카테고리") return [];
    var out = [], seen = {};
    for (var i = headRow + 1; i < rows.length; i++) {
      var row2 = rows[i] || [];
      var cat = str(cell(row2, catCol));
      var rate = Core.toNumber(cell(row2, rateCol));
      if (!cat || !rate) continue;
      var key = norm(cat);
      if (seen[key]) continue;
      seen[key] = 1;
      out.push({
        site: siteCol >= 0 ? str(cell(row2, siteCol)) : "",
        category: cat,
        rate: rate,
        rateVat: Math.round(rate * 1.1 * 1e6) / 1e6
      });
    }
    return out;
  }

  /* ---------- CS ---------- */
  function readCs(rows) {
    if (!rows || !rows.length) return [];
    var h = findHeaderRow(rows, ["일자", "주문번호", "고객명", "구매 플랫폼", "제품명", "연락처", "방식", "구분", "진행상태"], 6);
    if (h < 0) return [];
    var head = rows[h] || [];
    function col(names) {
      for (var n = 0; n < names.length; n++) {
        for (var i = 0; i < head.length; i++) if (norm(head[i]) === norm(names[n])) return i;
      }
      return -1;
    }
    var ci = {
      date: col(["일자", "날짜"]), orderNo: col(["주문번호", "주문번호(링크)"]), customer: col(["고객명"]),
      platform: col(["구매 플랫폼", "구매플랫폼", "플랫폼"]), product: col(["제품명", "상품명"]),
      phone: col(["연락처", "전화번호"]), channel: col(["방식"]), type: col(["구분"]),
      status: col(["진행상태"]), stage: col(["세부단계"]), action: col(["조치내용"])
    };
    var out = [];
    for (var r = h + 1; r < rows.length; r++) {
      var row = rows[r] || [];
      if (!nonEmpty(row.slice(0, 12))) continue;
      var item = { id: newId() };
      Object.keys(ci).forEach(function (k) { item[k] = str(cell(row, ci[k])); });
      if (!item.customer && !item.orderNo && !item.product) continue;
      item.date = Core.dateOnly(cell(row, ci.date)) || item.date;
      out.push(item);
    }
    return out;
  }

  /* ---------- 4.송장업로드리스트 ---------- */
  function readInvoiceList(rows) {
    if (!rows || !rows.length) return [];
    var h = findHeaderRow(rows, ["주문고유번호", "상태", "송장번호", "배송사코드"], 6);
    var head = h >= 0 ? rows[h] : [];
    var noCol = 0, stCol = -1, courCol = -1, invCol = -1;
    for (var i = 0; i < head.length; i++) {
      var n = norm(head[i]);
      if (n === "주문고유번호") noCol = i;
      else if (n === "상태") stCol = i;
      else if (n.indexOf("배송사") !== -1) courCol = i;
      else if (n.indexOf("송장") !== -1) invCol = i;
    }
    var out = [], start = h >= 0 ? h + 1 : 0;
    for (var r = start; r < rows.length; r++) {
      var row = rows[r] || [];
      var no = str(cell(row, noCol));
      if (!no) continue;
      out.push({
        uniqueNo: no.replace(/\.0+$/, ""),
        status: stCol >= 0 ? str(cell(row, stCol)) : "완료",
        courierCode: courCol >= 0 ? Core.normalizeCourier(cell(row, courCol)) : "",
        invoiceNo: invCol >= 0 ? str(cell(row, invCol)) : ""
      });
    }
    return out;
  }

  /* ---------- 사입 ---------- */
  function readStock(rows) {
    if (!rows || !rows.length) return [];
    var h = findHeaderRow(rows, ["상품명", "담당자", "구매처", "계정", "구매금액", "주문번호"], 6);
    if (h < 0) return [];
    var head = rows[h];
    function col(name) {
      for (var i = 0; i < head.length; i++) if (norm(head[i]) === norm(name)) return i;
      return -1;
    }
    var ci = {
      productName: col("상품명"), manager: col("담당자"), vendor: col("구매처"), account: col("계정"),
      amount: col("구매금액"), orderNo: col("주문번호"), paidAt: col("결제일시"), card: col("카드정보"),
      point: col("포인트"), orderedYn: col("주문여부"), saleStatus: col("판매현황")
    };
    var out = [];
    for (var r = h + 1; r < rows.length; r++) {
      var row = rows[r] || [];
      var pn = str(cell(row, ci.productName));
      if (!pn) continue;
      out.push({
        id: newId(),
        productName: pn, manager: str(cell(row, ci.manager)), vendor: str(cell(row, ci.vendor)),
        account: str(cell(row, ci.account)), amount: Core.toNumber(cell(row, ci.amount)),
        orderNo: str(cell(row, ci.orderNo)), paidAt: str(cell(row, ci.paidAt)),
        card: str(cell(row, ci.card)), point: Core.toNumber(cell(row, ci.point)),
        orderedYn: str(cell(row, ci.orderedYn)), saleStatus: str(cell(row, ci.saleStatus))
      });
    }
    return out;
  }

  /* ---------- 3.계정카드정보 ---------- */
  function readAccounts(rows) {
    var accounts = [], cards = [];
    if (!rows || !rows.length) return { accounts: accounts, cards: cards };
    var h = findHeaderRow(rows, ["플랫폼", "계정주인", "아이디", "비밀번호", "멤버십", "상태"], 8);
    if (h >= 0) {
      var head = rows[h];
      var base = -1;
      for (var i = 0; i < head.length; i++) if (norm(head[i]) === "아이디") { base = i; break; }
      if (base >= 0) {
        var pf = base - 2, ow = base - 1;
        var lastPlatform = "";
        for (var r = h + 1; r < rows.length; r++) {
          var row = rows[r] || [];
          var id = str(cell(row, base));
          var platform = pf >= 0 ? str(cell(row, pf)) : "";
          if (platform && !id) { lastPlatform = platform; continue; }
          if (!id) continue;
          if (platform) lastPlatform = platform;
          accounts.push({
            id2: newId(),
            platform: lastPlatform,
            owner: ow >= 0 ? str(cell(row, ow)) : "",
            id: id,
            pw: str(cell(row, base + 1)),
            membership: str(cell(row, base + 2)),
            status: str(cell(row, base + 3)),
            memo: str(cell(row, base + 4))
          });
        }
      }
    }
    // 카드 블록
    var ch = -1, cbase = -1;
    for (var rr = 0; rr < Math.min(rows.length, 12); rr++) {
      var row2 = rows[rr] || [];
      for (var c = 0; c < row2.length; c++) {
        if (norm(row2[c]) === "카드명" || norm(row2[c]) === "카드번호") { ch = rr; cbase = norm(row2[c]) === "카드명" ? c : c - 1; break; }
      }
      if (ch >= 0) break;
    }
    if (ch >= 0 && cbase >= 0) {
      for (var r2 = ch + 1; r2 < rows.length; r2++) {
        var row3 = rows[r2] || [];
        var nm = str(cell(row3, cbase)), num = str(cell(row3, cbase + 1));
        if (!nm && !num) continue;
        cards.push({
          id2: newId(), name: nm, number: num,
          expire: str(cell(row3, cbase + 2)), cvc: str(cell(row3, cbase + 3)),
          pin: str(cell(row3, cbase + 4)), birth: str(cell(row3, cbase + 5)),
          memo: str(cell(row3, cbase + 6))
        });
      }
    }
    return { accounts: accounts, cards: cards };
  }

  /* ---------- DAY / MON (과거 실적 보존용) ---------- */
  function readHistory(dayRows, monRows) {
    var daily = {}, monthly = {};
    if (dayRows && dayRows.length) {
      for (var r = 1; r < dayRows.length; r++) {
        var row = dayRows[r] || [];
        var d = Core.dateOnly(row[2]);
        if (!d) continue;
        var cnt = Core.toNumber(row[4]), rev = Core.toNumber(row[5]), mar = Core.toNumber(row[6]), pt = Core.toNumber(row[7]);
        if (!cnt && !rev && !mar) continue;
        daily[d] = { count: cnt, revenue: rev, margin: mar, point: pt };
      }
    }
    if (monRows && monRows.length) {
      for (var m = 1; m < monRows.length; m++) {
        var row2 = monRows[m] || [];
        var y = Math.round(Core.toNumber(row2[0])), mm = Math.round(Core.toNumber(row2[1]));
        if (!y || !mm) continue;
        var cnt2 = Core.toNumber(row2[2]), rev2 = Core.toNumber(row2[3]), mar2 = Core.toNumber(row2[4]), pt2 = Core.toNumber(row2[5]);
        if (!cnt2 && !rev2 && !mar2) continue;
        monthly[y + "-" + ("0" + mm).slice(-2)] = { count: cnt2, revenue: rev2, margin: mar2, point: pt2 };
      }
    }
    return { daily: daily, monthly: monthly };
  }

  /* ---------------------------------------------------------------
   * 워크북 한 방에 읽기
   * --------------------------------------------------------------- */
  function fromWorkbook(wb) {
    var out = {
      orders: [], blacklist: [], fees: [], cs: [], stock: [],
      accounts: [], cards: [], invoiceList: [], history: { daily: {}, monthly: {} },
      found: []
    };
    function take(names, fn, label) {
      var rows = wb.pick(names);
      if (!rows || !rows.length) return null;
      var res = fn(rows);
      if (res && (res.length || Object.keys(res).length)) out.found.push(label);
      return res;
    }

    out.orders = take(["2.주문서", "주문서", "주문관리"], readOrders, "주문서") || [];
    out.blacklist = take(["블랙리스트", "blacklist"], readBlacklist, "블랙리스트") || [];
    out.fees = take(["수수료", "수수료표"], readFees, "수수료") || [];
    out.cs = take(["CS", "CS관리"], readCs, "CS") || [];
    out.invoiceList = take(["4.송장업로드리스트", "송장업로드리스트", "송장업로드", "운송장업로드"], readInvoiceList, "송장업로드") || [];

    if (accRows) {

    }

  /* ---------------------------------------------------------------
   * 붙여넣기(TSV/CSV) → 주문
   * --------------------------------------------------------------- */
  function dsvToMatrix(text, delim) {
    var rows = [], row = [], cur = "", i = 0, inQ = false;
    while (i < text.length) {
      var ch = text[i];
      if (inQ) {
        if (ch === '"') {

        }
        cur += ch; i++; continue;
      }
      if (ch === '"' && cur === "") { inQ = true; i++; continue; }
      if (ch === delim) { row.push(cur); cur = ""; i++; continue; }
      if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; i++; continue; }
      cur += ch; i++;

<script>
/* ===== template.js ===== */
/* =====================================================================
 * template.js — "수기로도 쓸 수 있는" 통합 주문관리 엑셀 양식 생성기
 *
 * 2026-09 최신 워크북의 열 이름·순서를 그대로 유지하되,
 * 손으로 계산하던 부분을 전부 수식/드롭다운/조건부서식으로 바꿉니다.
 *
 *   - 수수료율·결제기준가·순마진·마진률·부가세·올라수수료 → 자동 수식
 *   - 담당자/구매처/카드/주문여부/배송사/카테고리        → 드롭다운
 *   - 블랙리스트 이름·주소 일치                          → 빨간색 "위험" 자동 표시
 *   - 송장 업로드 완료 여부                              → 자동 대조
 *   - 대시보드 / DAY / MON                               → 수식 기반 자동 집계
 *
 * 브라우저(app.js)와 node(tools/build-template.js) 양쪽에서 씁니다.
 * ===================================================================== */
(function (global) {
  "use strict";

  var Core = global.OrderCore || (typeof require !== "undefined" ? require("./core.js") : null);
  var Xlsx = global.XlsxLite || (typeof require !== "undefined" ? require("./xlsx-lite.js") : null);
  var L = Xlsx.colName;

  var COLS = Core.ORDER_COLUMNS;
  var HEADER_ROW = 3;          // 헤더 = 3행 (원본 워크북과 동일)
  var FIRST_DATA_ROW = 4;
  var FILL_ROWS = 400;         // 빈 행에도 수식을 미리 깔아둘 개수
  var BL_ROWS = 600;           // 블랙리스트 참조 범위
  var FEE_ROWS = 200;

  /* 열 인덱스 → 엑셀 문자 (주문서 기준) */
  var IDX = {};
  COLS.forEach(function (c, i) { IDX[c.key] = i; });
  function C(key) { return L(IDX[key]); }           // 예: C("salePrice") -> "F"
  var EXTRA_RISK = COLS.length;                     // 경고 열
  var EXTRA_STEP = COLS.length + 1;                 // 진행상태 열
  var RISK = L(EXTRA_RISK), STEP = L(EXTRA_STEP);
  var LAST_COL = L(EXTRA_STEP);

  function styleFor(col) {
    if (col.type === "money") return col.kind === "input" ? "moneyInput" : "money";
    if (col.type === "int") return col.kind === "input" ? "intInput" : "int";
    if (col.type === "pct") return "pct2";
    if (col.type === "date") return "date";
    if (col.type === "datetime") return "datetime";
    if (col.kind === "input") return "input";
    return "base";
  }

  /* ---------------------------------------------------------------
   * 주문서 시트
   * --------------------------------------------------------------- */
  function orderSheet(data) {
    var orders = data.orders || [];
    var rows = [];

    rows[0] = [{ v: "주문서 — 통합 주문관리", s: "title" }];
    rows[0][IDX.manager] = { v: "파란 칸 = 직접 입력 / 흰 칸 = 자동 수집·자동 계산", s: "note" };
    rows[1] = [{ v: "빨간 '위험' 표시는 블랙리스트 이름·주소와 일치한다는 뜻입니다. 발송 전 반드시 확인하세요.", s: "note" }];

    // 헤더(3행)
    var head = COLS.map(function (c) { return { v: c.label, s: "header" }; });
    head[EXTRA_RISK] = { v: "블랙리스트", s: "header" };
    head[EXTRA_STEP] = { v: "진행상태", s: "header" };
    rows[HEADER_ROW - 1] = head;

    var total = Math.max(orders.length + FILL_ROWS, FILL_ROWS);
    for (var i = 0; i < total; i++) {
      var r = FIRST_DATA_ROW + i;           // 실제 엑셀 행번호
      var o = orders[i] || null;
      rows[r - 1] = dataRow(o, r);
    }

    var cols = COLS.map(function (c) { return { w: c.w }; });
    cols[EXTRA_RISK] = { w: 12 };
    cols[EXTRA_STEP] = { w: 11 };

    var lastRow = FIRST_DATA_ROW + total - 1;
    var body = "$A$" + FIRST_DATA_ROW + ":$" + LAST_COL + "$" + lastRow;

    return {
      name: "주문서",
      tabSelected: true,
      rows: rows,
      cols: cols,
      freeze: { row: HEADER_ROW, col: 4 },
      autoFilter: "A" + HEADER_ROW + ":" + LAST_COL + lastRow,
      rowHeights: { 1: 26, 2: 18, 3: 30 },
      validations: [
        { sqref: C("manager") + FIRST_DATA_ROW + ":" + C("manager") + lastRow, formula: "담당자목록" },
        { sqref: C("vendor") + FIRST_DATA_ROW + ":" + C("vendor") + lastRow, formula: "구매처목록" },
        { sqref: C("cardName") + FIRST_DATA_ROW + ":" + C("cardName") + lastRow, formula: "카드목록" },
        { sqref: C("orderedYn") + FIRST_DATA_ROW + ":" + C("orderedYn") + lastRow, values: ["O", "X"] },
        { sqref: C("courierCode") + FIRST_DATA_ROW + ":" + C("courierCode") + lastRow, formula: "택배사목록" },
        { sqref: C("category") + FIRST_DATA_ROW + ":" + C("category") + lastRow, formula: "카테고리목록" }
      ],
      condFormats: [{
        sqref: body.replace(/\$/g, ""),
        rules: [
          { formula: "$" + RISK + FIRST_DATA_ROW + '="위험"', dxf: 0, priority: 1 },
          { formula: "$" + RISK + FIRST_DATA_ROW + '="주소확인"', dxf: 1, priority: 2 },
          { formula: "$" + STEP + FIRST_DATA_ROW + '="업로드완료"', dxf: 2, priority: 4 },
          { formula: "N($" + C("netMargin") + FIRST_DATA_ROW + ")<0", dxf: 3, priority: 3 }
        ]
      }]
    };
  }

  function dataRow(o, r) {
    var row = [];
    var sale = "$" + C("salePrice") + r;
    var guard = "IF(" + sale + '="","",';

    COLS.forEach(function (col, ci) {
      var style = styleFor(col);
      if (col.kind === "calc") {
        row[ci] = { s: style, f: calcFormula(col.key, r) };
        return;
      }
      if (!o) { row[ci] = { v: "", s: style }; return; }
      var v = o[col.key];
      if (v === null || v === undefined || v === "") { row[ci] = { v: "", s: style }; return; }
      if (col.type === "money" || col.type === "int") row[ci] = { v: Core.toNumber(v), s: style };
      else if (col.type === "date" || col.type === "datetime") {
        var serial = Core.toSerial(v);
        row[ci] = serial == null ? { v: String(v), s: style } : { v: serial, s: style };
      } else row[ci] = { v: String(v), s: style };
    });

    // 블랙리스트 경고 — COUNTIF의 '*' 와일드카드가 마스킹 이름(김성*)까지 잡아줍니다.
    row[EXTRA_RISK] = {
      s: "center",
      f: "IF($" + C("recipient") + r + '="","",' +
        "IF(COUNTIF(블랙리스트!$A$2:$A$" + BL_ROWS + ",$" + C("recipient") + r + ')>0,"위험",' +
        "IF(SUMPRODUCT((블랙리스트!$B$2:$B$" + BL_ROWS + '<>"")*ISNUMBER(SEARCH(블랙리스트!$B$2:$B$' + BL_ROWS +
        '&"",$' + C("address") + r + '&"")))>0,"주소확인","")))'
    };
    row[EXTRA_STEP] = {
      s: "center",
      f: "IF($" + C("productName") + r + '="","",' +
        "IF($" + C("invoiceUploaded") + r + '="완료","업로드완료",' +
        "IF($" + C("invoiceNo") + r + '<>"","송장입력",' +
        "IF(UPPER($" + C("orderedYn") + r + ')="O","발주완료","신규"))))'
    };
    return row;
  }

  /* 계산 열 수식 — core.js의 computeOrder()와 같은 식 */
  function calcFormula(key, r) {
    var sale = "$" + C("salePrice") + r;
    var g = 'IF(' + sale + '="","",';
    switch (key) {
      case "settleSite":
        return "IF($" + C("siteName") + r + '="","",$' + C("siteName") + r + ")";
      case "settleOrderNo":
        return "IF($" + C("siteOrderNo") + r + '="","",IFERROR(LEFT($' + C("siteOrderNo") + r +
          ',FIND(" ",$' + C("siteOrderNo") + r + '&" ")-1),$' + C("siteOrderNo") + r + "))";
      case "saleDate":
        return "IF($" + C("orderedAt") + r + '="","",INT($' + C("orderedAt") + r + "))";
      case "revenue":
        return g + sale + ")";
      case "feeRate":
        return "IF($" + C("category") + r + '="","",IFERROR(VLOOKUP($' + C("category") + r +
          ",수수료!$A$2:$D$" + FEE_ROWS + ',3,FALSE),""))';
      case "feeRateVat":
        return "IF($" + C("feeRate") + r + '="","",ROUND($' + C("feeRate") + r + "*1.1,6))";
      case "settleBase":
        return "IF(OR(" + sale + '="",$' + C("feeRateVat") + r + '=""),"",ROUND(' + sale +
          "*(1-$" + C("feeRateVat") + r + "),2))";
      case "shipNet":
        return "IF($" + C("feeRateVat") + r + '="","",ROUND(N($' + C("shipFee") + r +
          ")*(1-$" + C("feeRateVat") + r + "),2))";
      case "fee":
        return "IF(OR(" + sale + '="",$' + C("feeRateVat") + r + '=""),"",ROUND(' + sale +
          "*$" + C("feeRateVat") + r + ",2))";
      case "netMargin":
        return "IF(OR($" + C("settleBase") + r + '="",N($' + C("buyAmount") + r + ')=0),"",' +
          "ROUND(($" + C("settleBase") + r + "+N($" + C("shipNet") + r + ")-N($" + C("buyAmount") + r +
          ")-N($" + C("discount") + r + "))/1.1,0))";
      case "vat":
        return "IF($" + C("netMargin") + r + '="","",ROUND($' + C("netMargin") + r + "*0.1,0))";
      case "marginRate":
        return "IF(OR($" + C("netMargin") + r + '="",N(' + sale + ')=0),"",$' + C("netMargin") + r + "/" + sale + ")";
      case "pointOut":
        return "N($" + C("point") + r + ")";
      case "ollaFee":
        return g + "ROUND(" + sale + "*0.0096,0))";
      case "invoiceUploaded":
        return "IF($" + C("uniqueNo") + r + '="","",IF(COUNTIF(송장업로드!$A$2:$A$5000,$' +
          C("uniqueNo") + r + ')>0,"완료","대기"))';

    }
  }

  /* ---------------------------------------------------------------
   * 대시보드 — 전부 수식. 주문서에 입력하면 즉시 반영됩니다.
   * --------------------------------------------------------------- */
  function dashboardSheet(year) {
    var R = "주문서!$" + C("saleDate") + "$4:$" + C("saleDate") + "$5000";     // 매출일자
    var REV = "주문서!$" + C("revenue") + "$4:$" + C("revenue") + "$5000";      // 매출금액

    var VEND = "주문서!$" + C("vendor") + "$4:$" + C("vendor") + "$5000";
    var MGR = "주문서!$" + C("manager") + "$4:$" + C("manager") + "$5000";

    ]);
    rows.push([
      { v: "순마진", s: "base" }, { s: "money", f: "SUMIFS(" + MAR + "," + R + ",TODAY())" },
      { v: "순마진", s: "base" }, { s: "money", f: "SUMIFS(" + MAR + "," + R + ',">="&EOMONTH(TODAY(),-1)+1,' + R + ',"<="&EOMONTH(TODAY(),0))' },
      { v: "총 순마진", s: "base" }, { s: "money", f: "SUM(" + MAR + ")" }
    ]);
    rows.push([
      { v: "마진률", s: "base" }, { s: "pct2", f: 'IF(B4=0,"",B5/B4)' },

    ]);
    rows.push([
      { v: "포인트", s: "base" }, { s: "money", f: "SUMIFS(" + PNT + "," + R + ",TODAY())" },

      { v: "발주완료", s: "base" }, { s: "int", f: "COUNTIF(" + YN + ',"O")' },
      { v: "송장 미입력", s: "base" }, { s: "int", f: 'COUNTIFS(' + YN + ',"O",' + INV + ',"")' }]);
    rows.push([{ v: "블랙리스트 위험", s: "danger" }, { s: "int", f: "COUNTIF(" + RISKR + ',"위험")' },
      { v: "주소 확인 필요", s: "base" }, { s: "int", f: "COUNTIF(" + RISKR + ',"주소확인")' },
      { v: "역마진 건", s: "base" }, { s: "int", f: "COUNTIF(" + MAR + ',"<0")' }]);
    rows.push([]);

    // --- 월별
    rows.push([{ v: year + "년 월별", s: "subhead" }, "", "", "", "", ""]);
    rows.push([{ v: "월", s: "header" }, { v: "주문건수", s: "header" }, { v: "매출액", s: "header" },

        { s: "money", f: "SUMIFS(" + REV + "," + R + ',">="&' + from + "," + R + ',"<="&' + to + ")" },
        { s: "money", f: "SUMIFS(" + MAR + "," + R + ',">="&' + from + "," + R + ',"<="&' + to + ")" },
        { s: "money", f: "SUMIFS(" + PNT + "," + R + ',">="&' + from + "," + R + ',"<="&' + to + ")" },
        { s: "pct2", f: 'IF(C' + r + '=0,"",D' + r + "/C" + r + ")" }
      ]);
    }
    rows.push([{ v: "합계", s: "header" },
      { s: "int", f: "SUM(B" + monthStart + ":B" + (monthStart + 11) + ")" },
      { s: "money", f: "SUM(C" + monthStart + ":C" + (monthStart + 11) + ")" },
      { s: "money", f: "SUM(D" + monthStart + ":D" + (monthStart + 11) + ")" },
      { s: "money", f: "SUM(E" + monthStart + ":E" + (monthStart + 11) + ")" },
      { s: "pct2", f: 'IF(C' + (monthStart + 12) + '=0,"",D' + (monthStart + 12) + "/C" + (monthStart + 12) + ")" }]);
    rows.push([]);

    // --- 최근 30일
    rows.push([{ v: "최근 30일", s: "subhead" }]);
    rows.push([{ v: "날짜", s: "header" }, { v: "주문건수", s: "header" }, { v: "매출액", s: "header" },
      { v: "순마진", s: "header" }, { v: "마진률", s: "header" }]);
    var dayStart = rows.length + 1;
    for (var d = 29; d >= 0; d--) {
      var rr = dayStart + (29 - d);
      rows.push([
        { s: "date", f: "TODAY()-" + d },
        { s: "int", f: "COUNTIFS(" + R + ",$A" + rr + ")" },
        { s: "money", f: "SUMIFS(" + REV + "," + R + ",$A" + rr + ")" },
        { s: "money", f: "SUMIFS(" + MAR + "," + R + ",$A" + rr + ")" },
        { s: "pct2", f: 'IF(C' + rr + '=0,"",D' + rr + "/C" + rr + ")" }
      ]);
    }
    rows.push([]);

    // --- 구매처 / 담당자 / 카테고리별
    rows.push([{ v: "구매처별", s: "subhead" }, "", "", { v: "담당자별", s: "subhead" }, "", "",
      { v: "카테고리별", s: "subhead" }]);
    rows.push([{ v: "구매처", s: "header" }, { v: "건수", s: "header" }, { v: "순마진", s: "header" },
      { v: "담당자", s: "header" }, { v: "건수", s: "header" }, { v: "순마진", s: "header" },
      { v: "카테고리", s: "header" }, { v: "건수", s: "header" }, { v: "순마진", s: "header" }]);
    var brkStart = rows.length + 1;
    var vendors = ["11번가", "지마켓", "옥션", "롯데온", "롯데홈쇼핑", "신라쇼", "하프클럽", "쿠팡", "네이버"];
    var managers = ["명진", "본인"];
    var cats = ["쌀", "가공식품", "주방용품", "물티슈", "패션의류/패션잡화"];
    var maxLen = Math.max(vendors.length, managers.length, cats.length);
    for (var k = 0; k < maxLen; k++) {
      var rw = brkStart + k, line = [];
      if (vendors[k]) {
        line[0] = { v: vendors[k], s: "base" };
        line[1] = { s: "int", f: "COUNTIF(" + VEND + ",$A" + rw + ")" };
        line[2] = { s: "money", f: "SUMIF(" + VEND + ",$A" + rw + "," + MAR + ")" };
      }
      if (managers[k]) {
        line[3] = { v: managers[k], s: "base" };
        line[4] = { s: "int", f: "COUNTIF(" + MGR + ",$D" + rw + ")" };
        line[5] = { s: "money", f: "SUMIF(" + MGR + ",$D" + rw + "," + MAR + ")" };
      }
      if (cats[k]) {
        line[6] = { v: cats[k], s: "base" };
        line[7] = { s: "int", f: "COUNTIF(" + CAT + ",$G" + rw + ")" };
        line[8] = { s: "money", f: "SUMIF(" + CAT + ",$G" + rw + "," + MAR + ")" };
      }
      rows.push(line);
    }

    return {
      name: "대시보드",
      rows: rows,
      cols: [{ w: 24 }, { w: 15 }, { w: 20 }, { w: 15 }, { w: 20 }, { w: 15 }, { w: 22 }, { w: 12 }, { w: 15 }],
      freeze: { row: 1, col: 0 },
      rowHeights: { 1: 26 }
    };
  }

  /* ---------------------------------------------------------------
   * DAY / MON — 원본 워크북과 같은 자리, 다만 수식으로 자동 채움
   * --------------------------------------------------------------- */
  function dayMonSheets(year) {
    var R = "주문서!$" + C("saleDate") + "$4:$" + C("saleDate") + "$5000";
    var REV = "주문서!$" + C("revenue") + "$4:$" + C("revenue") + "$5000";
    var MAR = "주문서!$" + C("netMargin") + "$4:$" + C("netMargin") + "$5000";
    var PNT = "주문서!$" + C("pointOut") + "$4:$" + C("pointOut") + "$5000";

    var dayRows = [["연도", "월", "날짜", "요일", "주문건수", "매출액", "순마진", "포인트", "수익률"]
      .map(function (h) { return { v: h, s: "header" }; })];
    var start = new Date(Date.UTC(year, 0, 1)), end = new Date(Date.UTC(year, 11, 31));
    var r = 2;
    for (var d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
      var serial = Xlsx.dateToSerial(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
      dayRows.push([
        { v: d.getUTCFullYear(), s: "center" },
        { v: d.getUTCMonth() + 1, s: "center" },
        { v: serial, s: "date" },
        { s: "center", f: 'TEXT($C' + r + ',"aaa")' },
        { s: "int", f: "COUNTIFS(" + R + ",$C" + r + ")" },
        { s: "money", f: "SUMIFS(" + REV + "," + R + ",$C" + r + ")" },
        { s: "money", f: "SUMIFS(" + MAR + "," + R + ",$C" + r + ")" },
        { s: "money", f: "SUMIFS(" + PNT + "," + R + ",$C" + r + ")" },
        { s: "pct2", f: 'IF(F' + r + '=0,"",G' + r + "/F" + r + ")" }
      ]);
      r++;
    }

    var monRows = [["년", "월", "주문건수", "매출액", "순마진", "포인트", "수익률"]
      .map(function (h) { return { v: h, s: "header" }; })];
    for (var m = 1; m <= 12; m++) {
      var rr = m + 1;
      var from = "DATE(" + year + "," + m + ",1)", to = "EOMONTH(" + from + ",0)";
      monRows.push([
        { v: year, s: "center" }, { v: m, s: "center" },
        { s: "int", f: "COUNTIFS(" + R + ',">="&' + from + "," + R + ',"<="&' + to + ")" },
        { s: "money", f: "SUMIFS(" + REV + "," + R + ',">="&' + from + "," + R + ',"<="&' + to + ")" },
        { s: "money", f: "SUMIFS(" + MAR + "," + R + ',">="&' + from + "," + R + ',"<="&' + to + ")" },
        { s: "money", f: "SUMIFS(" + PNT + "," + R + ',">="&' + from + "," + R + ',"<="&' + to + ")" },
        { s: "pct2", f: 'IF(D' + rr + '=0,"",E' + rr + "/D" + rr + ")" }
      ]);
    }
    monRows.push([{ v: "합계", s: "header" }, "",
      { s: "int", f: "SUM(C2:C13)" }, { s: "money", f: "SUM(D2:D13)" },
      { s: "money", f: "SUM(E2:E13)" }, { s: "money", f: "SUM(F2:F13)" },
      { s: "pct2", f: 'IF(D14=0,"",E14/D14)' }]);

    return [
      { name: "DAY", rows: dayRows, freeze: { row: 1, col: 0 }, autoFilter: "A1:I1",
        cols: [{ w: 8 }, { w: 7 }, { w: 13 }, { w: 7 }, { w: 11 }, { w: 15 }, { w: 15 }, { w: 12 }, { w: 10 }] },
      { name: "MON", rows: monRows, freeze: { row: 1, col: 0 },
        cols: [{ w: 8 }, { w: 7 }, { w: 11 }, { w: 16 }, { w: 16 }, { w: 12 }, { w: 10 }] }
    ];
  }

  function uniq(arr) {
    var seen = {}, out = [];
    (arr || []).forEach(function (v) {
      var s = String(v == null ? "" : v).trim();

  }

  /* ---------------------------------------------------------------
   * 워크북 조립
   * --------------------------------------------------------------- */
  function buildWorkbook(data) {
    data = data || {};
    var year = data.year || new Date().getFullYear();
    var lists = listsSheet(data);
    var dm = dayMonSheets(year);

    var sheets = [
      guideSheet(),
      dashboardSheet(year),
      orderSheet(data),
      csSheet(data.cs),
      blacklistSheet(data.blacklist),
      invoiceSheet(data.invoiceList),
      stockSheet(data.stock),
      feeSheet(data.fees),

    var n = lists.counts;
    var definedNames = {
      "담당자목록": "목록!$A$2:$A$" + (n.managers + 1),

  /* =====================================================================

  function $(sel, root) { return (root || document).querySelector(sel); }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")

  }

    var num = typeof n === "number" ? n : toNum(n);

    var s = Math.round(Math.abs(num)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + s;
  }
  function won(n) { return n == null || n === "" ? "—" : "₩" + comma(n); }
  function pct(n, digits) {
    if (n == null || !isFinite(n)) return "—";
    return (n * 100).toFixed(digits == null ? 1 : digits) + "%";
  }
  function safeUrl(raw) {
    var s = String(raw || "").trim();
    if (!s) return "";
    if (!/^https?:\/\//i.test(s)) s = "https://" + s.replace(/^\/+/, "");
    try {
      var u = new URL(s);

  }

  }

  App.safeUrl = safeUrl; App.openUrl = openUrl; App.todayStr = todayStr; App.nowStr = nowStr; App.uid = uid;

  }
  function legacyCopy(s, done) {

      document.body.appendChild(ta); ta.select();

  }

  /* ---------- 모달 ---------- */
  function openModal(opts) {

      '<div class="modal' + (opts.wide ? " wide" : "") + '">' +
      '<div class="mhead"><h2>' + esc(opts.title || "") + '</h2><div class="spacer"></div>' +
      '<button class="btn ghost" data-close>닫기</button></div>' +
      '<div class="mbody">' + (opts.body || "") + "</div>" +

        '<button class="btn" data-close>취소</button><button class="btn primary" data-ok>확인</button>') + "</div>") +
      "</div>";
    root.appendChild(bg);
    function close() { bg.remove(); document.removeEventListener("keydown", onKey, true); }

    return { el: bg, close: close };

  /* =====================================================================
   * 저장 / 복원

  function safeSet(key, value) {
    try { localStorage.setItem(key, value); return true; }
    catch (e) { toast("브라우저 저장 공간이 가득 찼습니다. 백업 후 정리하세요."); return false; }
  }
  var persistTimer;
  function persist() {
    var s = App.state;
    safeSet(LS.orders, JSON.stringify(s.orders));
    safeSet(LS.aux, JSON.stringify({
      blacklist: s.blacklist, fees: s.fees, cs: s.cs, stock: s.stock,
      invoiceList: s.invoiceList, history: s.history
    }));
    safeSet(LS.secrets, JSON.stringify({ accounts: s.accounts, cards: s.cards }));
    safeSet(LS.settings, JSON.stringify(s.settings));
    safeSet(LS.ui, JSON.stringify(s.ui));
    safeSet(LS.trash, JSON.stringify(s.trash.slice(-50)));
  }
  function schedulePersist() {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(persist, 300);
  }
  App.persist = persist; App.schedulePersist = schedulePersist;

  function restore() {
    var s = App.state;
    try {
      var o = JSON.parse(localStorage.getItem(LS.orders));
      if (Array.isArray(o)) s.orders = o;
    } catch (e) {}
    try {
      var aux = JSON.parse(localStorage.getItem(LS.aux));

        s.cs = aux.cs || [];
        s.stock = aux.stock || [];
        s.invoiceList = aux.invoiceList || [];
        s.history = aux.history || { daily: {}, monthly: {} };
      }
    } catch (e) {}
    try {
      var sec = JSON.parse(localStorage.getItem(LS.secrets));
      if (sec) { s.accounts = sec.accounts || []; s.cards = sec.cards || []; }
    } catch (e) {}
    try {
      var st = JSON.parse(localStorage.getItem(LS.settings));
      if (st) {
        s.settings = Object.assign(s.settings, st);
        s.settings.defaults = Object.assign({ manager: "", vendor: "", vendorAccount: "", cardName: "" }, st.defaults || {});
      }
    } catch (e) {}
    try {
      var ui = JSON.parse(localStorage.getItem(LS.ui));
      if (ui) s.ui = Object.assign(s.ui, ui);
    } catch (e) {}
    try {
      var tr = JSON.parse(localStorage.getItem(LS.trash));

    s.settings.showSecrets = false;

  }

  /* =====================================================================
   * 계산 · 판정
   * ===================================================================== */
  function ctx() {
    return { fees: App.state.fees, ollaRate: App.state.settings.ollaRate };
  }
  function recompute(o) {
    Core.computeOrder(o, ctx());
    o._risk = Core.checkBlacklist(o, App.state.blacklist);

  }

  function riskOrders() {

  }

  function blankOrder() {

  /* ---------- 집계 ---------- */
  function statsFor(list) {
    var out = { count: 0, revenue: 0, margin: 0, point: 0, cost: 0, ready: 0 };
    list.forEach(function (o) {
      out.count++;
      out.revenue += toNum(o.revenue || o.salePrice);
      out.cost += toNum(o.buyAmount);
      out.point += toNum(o.point);
      if (o.netMargin != null) { out.margin += o.netMargin; out.ready++; }
    });
    out.rate = out.revenue ? out.margin / out.revenue : null;
    return out;
  }
  App.statsFor = statsFor;

  function dateKey(o) { return Core.dateOnly(o.saleDate || o.orderedAt || o.collectedAt); }

  function dailySeries(days) {
    var map = {};
    App.state.orders.forEach(function (o) {
      var d = dateKey(o);
      if (!d) return;
      if (!map[d]) map[d] = { count: 0, revenue: 0, margin: 0, point: 0 };
      map[d].count++;
      map[d].revenue += toNum(o.revenue || o.salePrice);
      map[d].margin += toNum(o.netMargin);
      map[d].point += toNum(o.point);
    });
    // 워크북 DAY 시트의 과거 실적은 주문 데이터가 없는 날짜만 보존
    Object.keys(App.state.history.daily || {}).forEach(function (d) {
      if (!map[d]) map[d] = App.state.history.daily[d];

    for (var i = days - 1; i >= 0; i--) {

  function kpi(k, v, cls, d) {

  function barChart(series, valueKey, title, caption) {
    var max = 0;
    series.forEach(function (d) { max = Math.max(max, Math.abs(d[valueKey] || 0)); });
    var bars = series.map(function (d) {
      var h = max ? Math.max(2, Math.round(Math.abs(d[valueKey] || 0) / max * 100)) : 2;
      var label = d.date ? d.date.slice(5) : d.month;

      '<div class="bars">' + bars + "</div>" +
      '<div class="chart-axis"><span>' + esc(first) + "</span><span>최대 " + comma(max) + "</span><span>" + esc(last) + "</span></div></div>";
  }
